<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hotel Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#f4f7fb;
      padding:30px 15px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#052135;
      font-size:2.3rem;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .tab-btn{
      border:none;
      background:white;
      color:#052135;
      padding:12px 24px;
      border-radius:30px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 3px 12px rgba(0,0,0,0.06);
      transition:0.3s;
    }

    .tab-btn.active{
      background:#052135;
      color:white;
    }

    .panel{
      display:none;
    }

    .panel.active{
      display:block;
    }

    .table-wrapper{
      overflow-x:auto;
      background:white;
      border-radius:20px;
      box-shadow:0 10px 35px rgba(0,0,0,0.08);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:850px;
    }

    thead{
      background:#052135;
      color:white;
    }

    th,
    td{
      padding:18px;
      text-align:left;
      border-bottom:1px solid #eee;
      font-size:15px;
    }

    tr:hover{
      background:#f9fbff;
    }

    .status{
      padding:8px 14px;
      border-radius:30px;
      font-size:13px;
      font-weight:600;
      display:inline-block;
    }

    .pending{
      background:#fff4d6;
      color:#b78103;
    }

    .confirmed{
      background:#dff7e8;
      color:#0a8f4d;
    }

    .btn-group{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button.action-btn{
      border:none;
      padding:10px 15px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      transition:0.3s;
    }

    .confirm-btn{
      background:#00b894;
      color:white;
    }

    .confirm-btn:hover{
      background:#019875;
    }

    .delete-btn{
      background:#ff4d4d;
      color:white;
    }

    .delete-btn:hover{
      background:#d63031;
    }

    .empty{
      text-align:center;
      padding:40px;
      color:#777;
    }

    .stars{
      color:#f5b301;
      letter-spacing:2px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Hotel Admin Dashboard</h1>

  <div class="tabs">

    <button class="tab-btn active" data-tab="bookings">Bookings</button>

    <button class="tab-btn" data-tab="reviews">Reviews</button>

  </div>

  <!-- BOOKINGS PANEL -->

  <div class="panel active" id="bookings-panel">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>Phone</th>
            <th>Guests</th>
            <th>Check-In</th>
            <th>Check-Out</th>
            <th>Status</th>
            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="bookingTable"></tbody>

      </table>

    </div>

  </div>

  <!-- REVIEWS PANEL -->

  <div class="panel" id="reviews-panel">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>Rating</th>
            <th>Review</th>
            <th>Status</th>
            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="reviewTable"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

// TAB SWITCHING

const tabButtons = document.querySelectorAll('.tab-btn');

tabButtons.forEach(btn => {

  btn.addEventListener('click', () => {

    tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    btn.classList.add('active');
    document.getElementById(`${btn.dataset.tab}-panel`).classList.add('active');

  });

});

function escapeHtml(text){

  const div = document.createElement('div');
  div.innerText = text || '';

  return div.innerHTML;

}

// LOAD BOOKINGS

async function loadBookings(){

  try {

    const response =
    await fetch('/bookings');

    const bookings =
    await response.json();

    const table =
    document.getElementById('bookingTable');

    table.innerHTML = '';

    // EMPTY STATE

    if(bookings.length === 0){

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No booking requests available.
          </td>
        </tr>
      `;

      return;
    }

    // SHOW BOOKINGS

    bookings.forEach(item => {

      table.innerHTML += `

        <tr>

          <td>${escapeHtml(item.name)}</td>

          <td>${escapeHtml(item.phone)}</td>

          <td>${escapeHtml(item.guests)}</td>

          <td>${escapeHtml(item.checkin)}</td>

          <td>${escapeHtml(item.checkout)}</td>

          <td>

            <span class="status ${item.status === 'Confirmed' ? 'confirmed' : 'pending'}">

              ${item.status}

            </span>

          </td>

          <td>

            <div class="btn-group">

              <button
                class="action-btn confirm-btn"
                onclick="confirmBooking('${item._id}')"
              >
                Confirm
              </button>

              <button
                class="action-btn delete-btn"
                onclick="deleteBooking('${item._id}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    });

  } catch(error){

    console.log(error);

    alert(
      'Failed to load bookings.'
    );

  }

}

// CONFIRM BOOKING

async function confirmBooking(id){

  try {

    await fetch(`/confirm-booking/${id}`, {

      method:'POST'

    });

    alert(
      'Booking confirmed successfully.'
    );

    loadBookings();

  } catch(error){

    console.log(error);

    alert(
      'Error confirming booking.'
    );

  }

}

// DELETE BOOKING

async function deleteBooking(id){

  const confirmDelete =
  confirm(
    'Are you sure you want to delete this booking?'
  );

  if(!confirmDelete){
    return;
  }

  try {

    await fetch(`/delete-booking/${id}`, {

      method:'DELETE'

    });

    alert(
      'Booking deleted successfully.'
    );

    loadBookings();

  } catch(error){

    console.log(error);

    alert(
      'Error deleting booking.'
    );

  }

}

// LOAD REVIEWS

async function loadReviews(){

  try {

    const response = await fetch('/admin/reviews');
    const reviews = await response.json();

    const table = document.getElementById('reviewTable');

    table.innerHTML = '';

    if(reviews.length === 0){

      table.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            No reviews submitted yet.
          </td>
        </tr>
      `;

      return;

    }

    reviews.forEach(item => {

      table.innerHTML += `

        <tr>

          <td>${escapeHtml(item.name)}</td>

          <td class="stars">${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)}</td>

          <td>${escapeHtml(item.comment)}</td>

          <td>

            <span class="status ${item.approved ? 'confirmed' : 'pending'}">

              ${item.approved ? 'Live' : 'Pending'}

            </span>

          </td>

          <td>

            <div class="btn-group">

              ${item.approved ? '' : `

                <button
                  class="action-btn confirm-btn"
                  onclick="approveReview('${item._id}')"
                >
                  Approve
                </button>

              `}

              <button
                class="action-btn delete-btn"
                onclick="deleteReview('${item._id}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `;

    });

  } catch(error){

    console.log(error);

    alert('Failed to load reviews.');

  }

}

// APPROVE REVIEW

async function approveReview(id){

  try {

    await fetch(`/approve-review/${id}`, {

      method: 'POST'

    });

    loadReviews();

  } catch(error){

    console.log(error);

    alert('Error approving review.');

  }

}

// DELETE REVIEW

async function deleteReview(id){

  const confirmDelete = confirm('Delete this review permanently?');

  if(!confirmDelete){
    return;
  }

  try {

    await fetch(`/delete-review/${id}`, {

      method: 'DELETE'

    });

    loadReviews();

  } catch(error){

    console.log(error);

    alert('Error deleting review.');

  }

}

// INITIAL LOAD

loadBookings();
loadReviews();

</script>

</body>
</html>
